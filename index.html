<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Mario World</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #080808;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Main game area */
    #game-container {
        position: relative;

        /* Original emulator ratio: 780 × 600 */
        width: min(780px, 100vw);
        aspect-ratio: 780 / 600;

        background: #000;
        overflow: hidden;

        box-shadow:
            0 0 0 1px rgba(255,255,255,0.08),
            0 10px 40px rgba(0,0,0,0.6);
    }

    /* Emulator */
    #game-frame {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        border: 0;
        display: block;
    }

    /* Control area */
    #controls {
        position: absolute;

        right: 14px;
        bottom: 14px;

        display: flex;
        gap: 8px;

        opacity: 0;

        transition:
            opacity 0.2s ease,
            transform 0.2s ease;

        transform: translateY(5px);

        z-index: 20;
    }

    #game-container:hover #controls {
        opacity: 1;
        transform: translateY(0);
    }

    /* Buttons */
    .control-button {
        width: 46px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 7px;

        background: rgba(15,15,15,0.88);
        color: white;

        cursor: pointer;

        backdrop-filter: blur(8px);

        transition:
            background 0.15s ease,
            transform 0.15s ease;
    }

    .control-button:hover {
        background: rgba(45,45,45,0.95);
        transform: scale(1.05);
    }

    .control-button:active {
        transform: scale(0.96);
    }

    /* Controller-style fullscreen icon */
    .fullscreen-icon {
        width: 21px;
        height: 17px;

        position: relative;
    }

    .fullscreen-icon::before,
    .fullscreen-icon::after {
        content: "";
        position: absolute;
        inset: 0;
    }

    /* Corner brackets */
    .fullscreen-icon::before {
        border-top: 2px solid white;
        border-left: 2px solid white;

        width: 8px;
        height: 8px;

        top: 0;
        left: 0;

        box-shadow:
            11px 0 0 -1px transparent,
            0 7px 0 -1px transparent;
    }

    .fullscreen-icon::after {
        border-bottom: 2px solid white;
        border-right: 2px solid white;

        width: 8px;
        height: 8px;

        right: 0;
        bottom: 0;
    }

    /* Exit fullscreen icon */
    .exit-icon {
        width: 19px;
        height: 19px;
        position: relative;
    }

    .exit-icon::before,
    .exit-icon::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
    }

    .exit-icon::before {
        top: 1px;
        left: 1px;

        border-top: 2px solid white;
        border-left: 2px solid white;
    }

    .exit-icon::after {
        bottom: 1px;
        right: 1px;

        border-bottom: 2px solid white;
        border-right: 2px solid white;
    }

    /* Fullscreen mode */
    #game-container:fullscreen {
        width: 100vw;
        height: 100vh;

        aspect-ratio: auto;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
    }

    /*
       Keep the original game aspect ratio.
       The iframe scales until it reaches either
       the screen width or screen height.
    */
    #game-container:fullscreen #game-frame {
        position: relative;

        width: min(100vw, 1300px);
        height: min(100vh, 1000px);

        aspect-ratio: 780 / 600;

        flex: 0 0 auto;
    }

    /* Make sure the controls stay visible in fullscreen */
    #game-container:fullscreen #controls {
        opacity: 1;
        transform: translateY(0);

        position: fixed;

        right: 20px;
        bottom: 20px;
    }

    /* Mobile */
    @media (max-width: 600px) {

        #game-container {
            width: 100vw;
        }

        #controls {
            opacity: 1;
            transform: none;
        }

        .control-button {
            width: 44px;
            height: 40px;
        }
    }
</style>

</head>

<body>

<div id="game-container">

```
<iframe
    id="game-frame"
    src="https://supernintendoemulator.com/game/?game=Super_Mario_World"
    allow="fullscreen"
    allowfullscreen>
</iframe>

<div id="controls">

    <button
        id="fullscreen-button"
        class="control-button"
        aria-label="Enter fullscreen"
        title="Fullscreen">

        <span class="fullscreen-icon"></span>

    </button>

    <button
        id="exit-button"
        class="control-button"
        aria-label="Exit fullscreen"
        title="Exit Fullscreen"
        style="display:none;">

        <span class="exit-icon"></span>

    </button>

</div>
```

</div>

<script>

const container = document.getElementById("game-container");
const fullscreenButton = document.getElementById("fullscreen-button");
const exitButton = document.getElementById("exit-button");


/* Enter fullscreen */
fullscreenButton.addEventListener("click", () => {

    if (container.requestFullscreen) {
        container.requestFullscreen();
    }

    else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
    }

});


/* Exit fullscreen */
exitButton.addEventListener("click", () => {

    if (document.exitFullscreen) {
        document.exitFullscreen();
    }

    else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
    }

});


/* Update buttons */
function updateFullscreenButtons() {

    const fullscreenElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    const isFullscreen =
        fullscreenElement === container;

    if (isFullscreen) {

        fullscreenButton.style.display = "none";
        exitButton.style.display = "flex";

    } else {

        fullscreenButton.style.display = "flex";
        exitButton.style.display = "none";

    }

}


/* Browser fullscreen changes */
document.addEventListener(
    "fullscreenchange",
    updateFullscreenButtons
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButtons
);

</script>

</body>
</html>
