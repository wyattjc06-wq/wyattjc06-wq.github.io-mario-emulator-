<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Mario World</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* GAME CONTAINER */
#game-container {
    position: relative;

    width: min(780px, 100vw);
    aspect-ratio: 780 / 600;

    background: #000;
    overflow: hidden;

    box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 10px 40px rgba(0,0,0,0.6);
}

/* GAME */
#game-frame {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    display: block;
}

/* CONTROLS */
#controls {
    position: absolute;

    right: 14px;
    bottom: 14px;

    display: flex;
    gap: 8px;

    opacity: 0;

    transform: translateY(5px);

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;

    z-index: 20;
}

#game-container:hover #controls {
    opacity: 1;
    transform: translateY(0);
}

/* GENERAL BUTTON */
.control-button {
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 7px;

    background: rgba(15,15,15,0.9);
    color: white;

    cursor: pointer;

    font-family: Arial, sans-serif;
    font-size: 14px;

    backdrop-filter: blur(8px);

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.control-button:hover {
    background: rgba(45,45,45,0.95);
    transform: scale(1.04);
}

.control-button:active {
    transform: scale(0.97);
}

/* NORMAL FULLSCREEN BUTTON */
#fullscreen-button {
    width: 46px;
}

/* PLAY FULLSCREEN BUTTON */
#play-fullscreen-button {
    padding: 0 15px;

    gap: 8px;

    font-weight: 600;
}

/* FULLSCREEN ICON */
.fullscreen-icon {
    width: 18px;
    height: 18px;

    position: relative;
}

.fullscreen-icon::before {
    content: "";

    position: absolute;

    left: 1px;
    top: 1px;

    width: 7px;
    height: 7px;

    border-top: 2px solid white;
    border-left: 2px solid white;
}

.fullscreen-icon::after {
    content: "";

    position: absolute;

    right: 1px;
    bottom: 1px;

    width: 7px;
    height: 7px;

    border-right: 2px solid white;
    border-bottom: 2px solid white;
}

/* EXIT ICON */
.exit-icon {
    width: 18px;
    height: 18px;

    position: relative;
}

.exit-icon::before {
    content: "";

    position: absolute;

    left: 1px;
    top: 1px;

    width: 7px;
    height: 7px;

    border-top: 2px solid white;
    border-left: 2px solid white;
}

.exit-icon::after {
    content: "";

    position: absolute;

    right: 1px;
    bottom: 1px;

    width: 7px;
    height: 7px;

    border-right: 2px solid white;
    border-bottom: 2px solid white;
}

/* EXIT BUTTON */
#exit-button {
    width: 46px;

    display: none;
}

/* TRUE FULLSCREEN */
#game-container:fullscreen {
    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;
}

#game-container:fullscreen #game-frame {
    position: relative;

    width: min(100vw, 1300px);
    height: min(100vh, 1000px);

    aspect-ratio: 780 / 600;

    flex: 0 0 auto;
}

#game-container:fullscreen #controls {
    opacity: 1;
    transform: translateY(0);

    position: fixed;

    right: 20px;
    bottom: 20px;
}

/* MOBILE */
@media (max-width: 600px) {

    #game-container {
        width: 100vw;
    }

    #controls {
        opacity: 1;
        transform: none;
    }

    #play-fullscreen-button {
        padding: 0 12px;
    }
}
</style>

</head>

<body>

<div id="game-container">

```
<iframe
    id="game-frame"
    src="https://supernintendoemulator.com/game/?game=Super_Mario_World"
    allow="fullscreen; autoplay"
    allowfullscreen>
</iframe>

<div id="controls">

    <!-- GOOGLE SITES FULLSCREEN -->
    <button
        id="play-fullscreen-button"
        class="control-button"
        title="Open fullscreen game">

        <span class="fullscreen-icon"></span>
        <span>PLAY FULLSCREEN</span>

    </button>

    <!-- NORMAL FULLSCREEN -->
    <button
        id="fullscreen-button"
        class="control-button"
        title="Fullscreen"
        aria-label="Fullscreen">

        <span class="fullscreen-icon"></span>

    </button>

    <!-- EXIT -->
    <button
        id="exit-button"
        class="control-button"
        title="Exit fullscreen"
        aria-label="Exit fullscreen">

        <span class="exit-icon"></span>

    </button>

</div>
```

</div>

<script>

const container =
    document.getElementById("game-container");

const fullscreenButton =
    document.getElementById("fullscreen-button");

const exitButton =
    document.getElementById("exit-button");

const playFullscreenButton =
    document.getElementById("play-fullscreen-button");


/*
    IMPORTANT:

    This is your GitHub Pages URL.

    The button opens THIS page directly,
    outside of Google Sites.
*/

const fullscreenPage =
    "https://wyattjc06-wq.github.io/wyattjc06-wq.github.io-mario-emulator-/";


/* GOOGLE SITES PLAY FULLSCREEN BUTTON */

playFullscreenButton.addEventListener("click", () => {

    window.open(
        fullscreenPage,
        "_blank",
        "noopener,noreferrer"
    );

});


/* NORMAL FULLSCREEN */

fullscreenButton.addEventListener("click", () => {

    if (container.requestFullscreen) {

        container.requestFullscreen();

    } else if (container.webkitRequestFullscreen) {

        container.webkitRequestFullscreen();

    }

});


/* EXIT FULLSCREEN */

exitButton.addEventListener("click", () => {

    if (document.exitFullscreen) {

        document.exitFullscreen();

    } else if (document.webkitExitFullscreen) {

        document.webkitExitFullscreen();

    }

});


/* UPDATE BUTTONS */

function updateFullscreenButtons() {

    const fullscreenElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    const isFullscreen =
        fullscreenElement === container;


    if (isFullscreen) {

        fullscreenButton.style.display = "none";

        exitButton.style.display = "flex";

        playFullscreenButton.style.display = "none";

    } else {

        fullscreenButton.style.display = "flex";

        exitButton.style.display = "none";

        playFullscreenButton.style.display = "flex";

    }

}


/* LISTEN FOR FULLSCREEN CHANGES */

document.addEventListener(
    "fullscreenchange",
    updateFullscreenButtons
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButtons
);

</script>

</body>
</html>
