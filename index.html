<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Mario World</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #game-container {
        position: relative;
        width: 780px;
        height: 600px;
        max-width: 100vw;
        max-height: 100vh;
        margin: auto;
        background: #000;
    }

    #game-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    /* Fullscreen button */
    #fullscreen-btn {
        position: absolute;
        right: 15px;
        bottom: 15px;

        padding: 10px 15px;

        border: 0;
        border-radius: 6px;

        background: rgba(0, 0, 0, 0.75);
        color: white;

        font-family: Arial, sans-serif;
        font-size: 15px;

        cursor: pointer;
        z-index: 100;
    }

    #fullscreen-btn:hover {
        background: rgba(40, 40, 40, 0.9);
    }

    /* Exit fullscreen button */
    #exit-btn {
        position: absolute;
        right: 15px;
        top: 15px;

        padding: 10px 15px;

        border: 0;
        border-radius: 6px;

        background: rgba(0, 0, 0, 0.75);
        color: white;

        font-family: Arial, sans-serif;
        font-size: 15px;

        cursor: pointer;
        z-index: 100;

        display: none;
    }

    #exit-btn:hover {
        background: rgba(40, 40, 40, 0.9);
    }

    /* When fullscreen */
    #game-container:fullscreen {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
    }

    #game-container:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
    }

    #game-container:fullscreen #game-frame {
        width: 100vw;
        height: 100vh;
    }

    #game-container:fullscreen #fullscreen-btn {
        display: none;
    }

    #game-container:fullscreen #exit-btn {
        display: block;
    }
</style>

</head>

<body>

<div id="game-container">

```
<iframe
    id="game-frame"
    src="https://supernintendoemulator.com/game/?game=Super_Mario_World"
    allow="fullscreen"
    allowfullscreen>
</iframe>

<button id="fullscreen-btn">
    ⛶ Fullscreen
</button>

<button id="exit-btn">
    ✕ Exit Fullscreen
</button>
```

</div>

<script>
    const gameContainer = document.getElementById("game-container");
    const fullscreenButton = document.getElementById("fullscreen-btn");
    const exitButton = document.getElementById("exit-btn");

    fullscreenButton.addEventListener("click", () => {
        if (gameContainer.requestFullscreen) {
            gameContainer.requestFullscreen();
        } 
        else if (gameContainer.webkitRequestFullscreen) {
            gameContainer.webkitRequestFullscreen();
        }
    });

    exitButton.addEventListener("click", () => {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
        else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    });

    document.addEventListener("fullscreenchange", updateButtons);
    document.addEventListener("webkitfullscreenchange", updateButtons);

    function updateButtons() {
        const fullscreen =
            document.fullscreenElement === gameContainer ||
            document.webkitFullscreenElement === gameContainer;

        if (fullscreen) {
            fullscreenButton.style.display = "none";
            exitButton.style.display = "block";
        } else {
            fullscreenButton.style.display = "block";
            exitButton.style.display = "none";
        }
    }
</script>

</body>
</html>
